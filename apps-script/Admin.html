<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard interno · Posgrado FCE</title>
  <style>
    :root {
      --primary: #0f3d5e;
      --primary-soft: #e8f3fb;
      --bg: #f5f7fb;
      --text: #18202a;
      --muted: #637083;
      --danger: #b42318;
      --success: #067647;
      --border: #d9e1ea;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 28px max(16px, calc((100vw - 1180px) / 2)); background: linear-gradient(135deg, var(--primary), #1e658f); color: white; }
    header h1 { margin: 6px 0 8px; font-size: clamp(28px, 5vw, 46px); }
    header p { margin: 0; color: #e6f2fa; }
    .eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; font-weight: 700; }
    main { width: min(1180px, calc(100% - 24px)); margin: 18px auto 48px; }
    .hidden { display: none !important; }
    .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 14px; }
    .card, .panel, dialog form { background: var(--card); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 12px 30px rgba(17, 38, 62, .08); }
    .card { padding: 16px; }
    .card span { color: var(--muted); }
    .card strong { display: block; color: var(--primary); font-size: 32px; margin-top: 6px; }
    .panel { padding: 18px; }
    .section-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .filters { display: grid; grid-template-columns: 1fr 240px; gap: 12px; margin: 14px 0; }
    label { display: grid; gap: 6px; font-weight: 700; color: #344054; }
    input, select, button, textarea { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font: inherit; }
    button { background: var(--primary); color: white; border: 0; cursor: pointer; font-weight: 800; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .danger { background: var(--danger); }
    .secondary { background: var(--primary-soft); color: var(--primary); }
    .small { padding: 8px 10px; border-radius: 10px; font-size: 13px; }
    .status { margin: 8px 0 0; color: var(--muted); }
    .status[data-type="success"] { color: var(--success); }
    .status[data-type="error"] { color: var(--danger); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 980px; }
    th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .pill { display: inline-block; padding: 4px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 700; font-size: 12px; }
    .pagination { display: flex; align-items: center; justify-content: center; gap: 12px; padding-top: 16px; }
    dialog { width: min(900px, calc(100% - 24px)); border: 0; padding: 0; background: transparent; }
    dialog::backdrop { background: rgba(0,0,0,.4); }
    dialog form { padding: 20px; }
    .dialog-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .close { width: auto; background: #eef2f7; color: var(--text); }
    .review-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; }
    .documents-list { display: grid; gap: 12px; }
    .document-card { border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 1fr 220px; gap: 12px; }
    .doc-actions { display: flex; flex-direction: column; gap: 8px; }
    a { color: var(--primary); font-weight: 700; }
    .not-authorized { padding: 20px; }
    @media (max-width: 850px) { .cards, .filters, .review-grid, .document-card { grid-template-columns: 1fr; } .section-heading { display: block; } }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Panel interno · Secretaría / Coordinación</p>
    <h1>Dashboard de admisiones</h1>
    <p id="user-info">Verificando usuario...</p>
  </header>

  <main>
    <section id="auth-error" class="panel not-authorized hidden"></section>

    <section id="dashboard" class="hidden">
      <section class="cards">
        <article class="card"><span>Total</span><strong id="count-total">0</strong></article>
        <article class="card"><span>Pendientes</span><strong id="count-pendiente">0</strong></article>
        <article class="card"><span>En revisión</span><strong id="count-revision">0</strong></article>
        <article class="card"><span>Admitidas</span><strong id="count-aprobada">0</strong></article>
        <article class="card"><span>Rechazadas</span><strong id="count-rechazada">0</strong></article>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div>
            <h2>Inscripciones recibidas</h2>
            <p class="status" id="message">Cargando...</p>
          </div>
          <button id="refresh" type="button">Actualizar</button>
        </div>

        <div class="filters">
          <label>Buscar
            <input id="search" type="search" placeholder="Apellido, nombre, DNI, email, carrera...">
          </label>
          <label>Estado
            <select id="status-filter">
              <option value="">Todos</option>
              <option>Pendiente</option>
              <option>En revisión</option>
              <option>Aprobada</option>
              <option>Rechazada</option>
            </select>
          </label>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Postulante</th>
                <th>Documento</th>
                <th>Contacto</th>
                <th>Carrera</th>
                <th>Estado</th>
                <th>Documentación</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="rows"><tr><td colspan="8">Cargando...</td></tr></tbody>
          </table>
        </div>
        <div id="pagination" class="pagination"></div>
      </section>
    </section>
  </main>

  <dialog id="review-dialog">
    <form method="dialog">
      <div class="dialog-top">
        <h2 id="dialog-title">Revisión</h2>
        <button class="close" value="cancel">Cerrar</button>
      </div>
      <div id="dialog-content"></div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">
        <button id="admit" type="button">Admitir inscripción</button>
        <button id="reject" type="button" class="danger">Rechazar inscripción</button>
      </div>
    </form>
  </dialog>

  <script>
    const PAGE_SIZE = 20;
    let user = null;
    let rows = [];
    let selected = null;
    let currentPage = 1;

    const $ = (id) => document.getElementById(id);

    function setMessage(text, type = 'info') {
      $('message').textContent = text;
      $('message').dataset.type = type;
    }

    function html(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function normalize(value) {
      return String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function parseDocs(item) {
      try { return Array.isArray(item.documentacion) ? item.documentacion : JSON.parse(item.documentacion || '[]'); }
      catch { return []; }
    }

    function docSummary(item) {
      const docs = parseDocs(item);
      if (!docs.length) return 'Sin documentos';
      const required = docs.filter((d) => d.obligatorio !== 'CONDICIONAL');
      const uploaded = required.filter((d) => d.file_url || d.url || d.fileId).length;
      const approved = docs.filter((d) => d.estado_documento === 'APROBADO').length;
      const rejected = docs.filter((d) => d.estado_documento === 'RECHAZADO').length;
      return `${uploaded}/${required.length || docs.length} obligatorios · ${approved} aprobados · ${rejected} rechazados`;
    }

    function link(url, text) {
      return url ? `<a href="${html(url)}" target="_blank" rel="noopener">${html(text)}</a>` : '<span>No disponible</span>';
    }

    function filteredRows() {
      const q = normalize($('search').value);
      const status = $('status-filter').value;
      return rows.filter((item) => {
        const haystack = normalize([item.codigoPublico, item.inscripcionId, item.nombre, item.dni, item.email, item.telefono, item.carrera, item.estado].join(' '));
        return (!q || haystack.includes(q)) && (!status || item.estado === status);
      });
    }

    function renderCounts() {
      const counts = { total: rows.length, pendiente: 0, revision: 0, aprobada: 0, rechazada: 0 };
      rows.forEach((item) => {
        if (item.estado === 'Pendiente') counts.pendiente++;
        if (item.estado === 'En revisión') counts.revision++;
        if (item.estado === 'Aprobada') counts.aprobada++;
        if (item.estado === 'Rechazada') counts.rechazada++;
      });
      $('count-total').textContent = counts.total;
      $('count-pendiente').textContent = counts.pendiente;
      $('count-revision').textContent = counts.revision;
      $('count-aprobada').textContent = counts.aprobada;
      $('count-rechazada').textContent = counts.rechazada;
    }

    function renderPagination(total) {
      const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      if (total <= PAGE_SIZE) { $('pagination').innerHTML = ''; return; }
      const from = (currentPage - 1) * PAGE_SIZE + 1;
      const to = Math.min(currentPage * PAGE_SIZE, total);
      $('pagination').innerHTML = `
        <button class="secondary" id="prev" ${currentPage === 1 ? 'disabled' : ''}>Anterior</button>
        <span>Página ${currentPage} de ${totalPages} · Mostrando ${from}-${to} de ${total}</span>
        <button class="secondary" id="next" ${currentPage === totalPages ? 'disabled' : ''}>Siguiente</button>
      `;
      $('prev')?.addEventListener('click', () => { currentPage--; renderTable(); });
      $('next')?.addEventListener('click', () => { currentPage++; renderTable(); });
    }

    function renderTable() {
      const filtered = filteredRows();
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageRows = filtered.slice(start, start + PAGE_SIZE);
      if (!pageRows.length) {
        $('rows').innerHTML = '<tr><td colspan="8">No hay inscripciones para mostrar.</td></tr>';
        renderPagination(0);
        return;
      }
      $('rows').innerHTML = pageRows.map((item) => `
        <tr>
          <td><strong>${html(item.codigoPublico || item.inscripcionId || '')}</strong></td>
          <td>${html(item.nombre || '')}</td>
          <td>${html(item.dni || '')}</td>
          <td>${html(item.email || '')}<br><small>${html(item.telefono || '')}</small></td>
          <td>${html(item.carrera || '')}</td>
          <td><span class="pill">${html(item.estado || '')}</span></td>
          <td>${html(docSummary(item))}</td>
          <td><button class="small" data-id="${html(item.codigoPublico || item.inscripcionId || '')}">Revisar</button></td>
        </tr>
      `).join('');
      document.querySelectorAll('[data-id]').forEach((button) => button.addEventListener('click', () => openReview(button.dataset.id)));
      renderPagination(filtered.length);
    }

    function renderDocs(item) {
      const docs = parseDocs(item);
      if (!docs.length) return '<p>No hay documentos asociados.</p>';
      return `<div class="documents-list">${docs.map((doc) => {
        const id = doc.documento_id || doc.documentoId || '';
        const status = doc.estado_documento || doc.estado || 'PENDIENTE';
        const url = doc.file_url || doc.url || '';
        const name = doc.tipo_documento || doc.tipo || 'Documento';
        const obs = doc.observacion_rechazo || '';
        return `<article class="document-card">
          <div>
            <strong>${html(name)}</strong>
            <p>Estado: <span class="pill">${html(status)}</span></p>
            ${obs ? `<p style="color:var(--danger)">Motivo: ${html(obs)}</p>` : ''}
            ${link(url, 'Abrir archivo')}
          </div>
          <div class="doc-actions">
            <button class="small" type="button" data-approve="${html(id)}">Aprobar documento</button>
            <button class="small danger" type="button" data-reject-doc="${html(id)}">Rechazar documento</button>
          </div>
        </article>`;
      }).join('')}</div>`;
    }

    function openReview(id) {
      selected = rows.find((item) => (item.codigoPublico || item.inscripcionId) === id);
      if (!selected) return;
      $('dialog-title').textContent = `Revisión ${selected.codigoPublico || selected.inscripcionId}`;
      $('dialog-content').innerHTML = `
        <div class="review-grid">
          <p><strong>Postulante:</strong> ${html(selected.nombre || '')}</p>
          <p><strong>Documento:</strong> ${html(selected.dni || '')}</p>
          <p><strong>Email:</strong> ${html(selected.email || '')}</p>
          <p><strong>Celular:</strong> ${html(selected.telefono || '')}</p>
          <p><strong>Carrera:</strong> ${html(selected.carrera || '')}</p>
          <p><strong>Estado:</strong> ${html(selected.estado || '')}</p>
          <p><strong>Carpeta Drive:</strong> ${link(selected.carpetaDriveUrl, 'Abrir carpeta')}</p>
          <p><strong>PDF unificado:</strong> ${link(selected.pdfUnificadoUrl, 'Abrir PDF')}</p>
        </div>
        <h3>Documentación</h3>
        ${renderDocs(selected)}
      `;
      document.querySelectorAll('[data-approve]').forEach((b) => b.addEventListener('click', () => approveDocument(b.dataset.approve)));
      document.querySelectorAll('[data-reject-doc]').forEach((b) => b.addEventListener('click', () => rejectDocument(b.dataset.rejectDoc)));
      $('review-dialog').showModal();
    }

    function load() {
      setMessage('Cargando inscripciones...');
      google.script.run
        .withSuccessHandler((response) => {
          user = response.usuario;
          rows = response.inscripciones || [];
          $('user-info').textContent = `${user.email} · ${user.rol}${user.carrera_ids && user.carrera_ids !== 'TODAS' ? ' · ' + user.carrera_ids : ''}`;
          $('dashboard').classList.remove('hidden');
          $('auth-error').classList.add('hidden');
          currentPage = 1;
          renderCounts();
          renderTable();
          setMessage(`Inscripciones cargadas: ${rows.length}.`, 'success');
        })
        .withFailureHandler((error) => {
          $('dashboard').classList.add('hidden');
          $('auth-error').classList.remove('hidden');
          $('auth-error').innerHTML = `<h2>Acceso no autorizado</h2><p>${html(error.message || error)}</p><p>Ingresá con una cuenta autorizada de la FCE o pedí que agreguen tu correo en la hoja Usuarios.</p>`;
          $('user-info').textContent = 'Acceso no autorizado';
        })
        .adminListInscriptions();
    }

    function approveDocument(documentoId) {
      google.script.run.withSuccessHandler(() => { load(); $('review-dialog').close(); }).withFailureHandler((e) => alert(e.message || e)).adminUpdateDocumentStatus(documentoId, 'APROBADO', '');
    }

    function rejectDocument(documentoId) {
      const motivo = prompt('Motivo del rechazo del documento:');
      if (!motivo) return;
      google.script.run.withSuccessHandler(() => { load(); $('review-dialog').close(); }).withFailureHandler((e) => alert(e.message || e)).adminUpdateDocumentStatus(documentoId, 'RECHAZADO', motivo);
    }

    function admitSelected() {
      if (!selected || !confirm('¿Confirmás que querés admitir esta inscripción?')) return;
      google.script.run.withSuccessHandler(() => { load(); $('review-dialog').close(); }).withFailureHandler((e) => alert(e.message || e)).adminAdmitInscription(selected.codigoPublico || selected.inscripcionId);
    }

    function rejectSelected() {
      if (!selected) return;
      const motivo = prompt('Motivo del rechazo de la inscripción:');
      if (!motivo) return;
      google.script.run.withSuccessHandler(() => { load(); $('review-dialog').close(); }).withFailureHandler((e) => alert(e.message || e)).adminRejectInscription(selected.codigoPublico || selected.inscripcionId, motivo);
    }

    $('refresh').addEventListener('click', load);
    $('search').addEventListener('input', () => { currentPage = 1; renderTable(); });
    $('status-filter').addEventListener('change', () => { currentPage = 1; renderTable(); });
    $('admit').addEventListener('click', admitSelected);
    $('reject').addEventListener('click', rejectSelected);
    load();
  </script>
</body>
</html>
